name: Build and publish the advisor image

on:
  release:
    types: [published]
  workflow_dispatch:

# Same shape as stakgraph-mcp: one native build per architecture, then a multi-arch manifest tagged with the
# release name and `latest`, on ghcr.io under the stakwork org.
jobs:
  build-amd64:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/stakwork/aws-advisor:${{ github.ref_name }}-amd64
          cache-from: type=registry,ref=ghcr.io/stakwork/aws-advisor:buildcache-amd64
          cache-to: type=registry,ref=ghcr.io/stakwork/aws-advisor:buildcache-amd64,mode=max
          provenance: false
          sbom: false

  build-arm64:
    runs-on: ubuntu-arm64
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/stakwork/aws-advisor:${{ github.ref_name }}-arm64
          cache-from: type=registry,ref=ghcr.io/stakwork/aws-advisor:buildcache-arm64
          cache-to: type=registry,ref=ghcr.io/stakwork/aws-advisor:buildcache-arm64,mode=max
          provenance: false
          sbom: false

  merge:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    permissions: { contents: read, packages: write }
    steps:
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Create and push the multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/stakwork/aws-advisor:${{ github.ref_name }} \
            -t ghcr.io/stakwork/aws-advisor:latest \
            ghcr.io/stakwork/aws-advisor:${{ github.ref_name }}-amd64 \
            ghcr.io/stakwork/aws-advisor:${{ github.ref_name }}-arm64
