name: Build and publish the advisor image

on:
  release:
    types: [published]
  workflow_dispatch:

# Same shape as stakgraph-mcp: one native build per architecture, then a multi-arch manifest tagged with the
# release name and `latest`, on ghcr.io under the stakwork org.
#
# Every image carries the OCI labels/annotations that tie it back to this repo and commit
# (org.opencontainers.image.source / .revision, generated by docker/metadata-action), and the final
# multi-arch digest gets a signed GitHub build-provenance attestation, so a digest can be traced to the
# commit that produced it:
#   gh attestation verify oci://ghcr.io/stakwork/aws-advisor@sha256:<digest> --owner stakwork
#   gh api /orgs/stakwork/attestations/sha256:<digest>
#   crane config ghcr.io/stakwork/aws-advisor@sha256:<digest> | jq .config.Labels

env:
  IMAGE: ghcr.io/stakwork/aws-advisor

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-amd64
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-amd64
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-amd64,mode=max
          provenance: false
          sbom: false

  build-arm64:
    runs-on: ubuntu-arm64
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-arm64
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-arm64
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-arm64,mode=max
          provenance: false
          sbom: false

  merge:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Create and push the multi-arch manifest
        # The index is a new object that references the per-arch images, so it needs its own annotations;
        # the labels inside the per-arch images carry over on their own.
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "index:org.opencontainers.image.version=${{ github.ref_name }}" \
            --annotation "index:org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t ${{ env.IMAGE }}:${{ github.ref_name }} \
            -t ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:${{ github.ref_name }}-amd64 \
            ${{ env.IMAGE }}:${{ github.ref_name }}-arm64
      - name: Resolve the multi-arch digest
        id: digest
        run: |
          d=$(docker buildx imagetools inspect ${{ env.IMAGE }}:${{ github.ref_name }} --format '{{.Manifest.Digest}}')
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          echo "Published ${{ env.IMAGE }}@$d from ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance (digest -> repo + commit, signed by GitHub)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
